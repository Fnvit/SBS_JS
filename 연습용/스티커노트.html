<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>스티커노트</title>
    <script src="https://kit.fontawesome.com/d19fdaba43.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="스티커노트.css">
    <script src="스티커노트.js" defer></script>
</head>
<body>
    <div class="note">
        <div class="note_list">
            <ol>
            </ol>
        </div>
        <div class="head">
            <div class="color_container"></div>
            <button type="button"><i class="fa-solid fa-plus"></i></button>
            <input class="title" value="제목없음" />
            <div>
                <button type="button"><i class="fa-solid fa-floppy-disk"></i></button>
                <button type="button"><i class="fa-solid fa-list"></i></button>
                <button type="button"><i class="fa-solid fa-palette"></i></button>
                <button type="button"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <label>
            <textarea></textarea>
        </label>
    </div>
</body>
</html>
