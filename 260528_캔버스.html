<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>캔버스</title>
</head>
<body>
    <canvas width="300" height="300"></canvas>
</body>
</html>
<script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'red';
    ctx.fillRect(0, 0, 100, 100); // (0, 0) 위치에 100x100 의 사각형







</script>
